<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="WALLE">
  <title>WALLE — Engineering Wallet</title>
  <defs>
    <linearGradient id="walleTile" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173C72" />
      <stop offset="0.55" stop-color="#0D2550" />
      <stop offset="1" stop-color="#071527" />
    </linearGradient>
    <linearGradient id="walleSteel" x1="11" y1="21" x2="52" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#C3D8F2" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#walleTile)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#7DD3FC" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Dompet digital -->
  <rect x="11" y="21" width="42" height="24.5" rx="6.5" fill="#0A1C36" stroke="url(#walleSteel)" stroke-width="2.4" />
  <path d="M14 26.4h34" stroke="#C3D8F2" stroke-opacity="0.38" stroke-width="1.3" stroke-linecap="round" />

  <!-- Huruf W dari jalur PCB -->
  <path d="M12.5 28.5 18.5 41l6-9.2 6 9.2 5.5-12.5" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="12.5" cy="28.5" r="1.5" fill="#7DD3FC" />

  <!-- Slot kartu dengan microchip -->
  <rect x="35.5" y="31" width="17" height="11.5" rx="3.4" fill="#123A6B" stroke="#EAF3FF" stroke-width="2" />
  <rect x="41" y="33.8" width="6.4" height="6.4" rx="1.2" fill="#0B2340" stroke="#67E8F9" stroke-width="1.6" />
  <path d="M39.2 35.6H41M39.2 38.4H41M47.4 35.6h2M47.4 38.4h2" stroke="#67E8F9" stroke-width="1.6" stroke-linecap="round" />
